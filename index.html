<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<script>
  
const SUPABASE_URL = 'https://exxagkfwfeofolorywnl.supabase.co';
const SUPABASE_KEY = 'sb_publishable_fV3gV7KzpeNazCI1gubEJw_OyigWwXW';

const supabaseClient = window.supabase.createClient(
  SUPABASE_URL,
  SUPABASE_KEY
);

let currentUser = null;

async function initAuth() {
  const { data: { session } } = await supabaseClient.auth.getSession();

  if (session && session.user) {
    currentUser = session.user;
    console.log('Logged in:', currentUser.email);
  } else {
    console.log('No active session');
  }
}

function showLoginScreen() {
  document.body.innerHTML = `
    <div style="
      min-height:100vh;
      display:flex;
      align-items:center;
      justify-content:center;
      background:#f7f8f5;
      padding:20px;
      direction:rtl;
      font-family:Tahoma,'Segoe UI',Arial,sans-serif;
    ">
      <div style="
        width:100%;
        max-width:420px;
        background:#fff;
        border:1px solid #dce3dc;
        border-radius:18px;
        padding:28px;
        box-shadow:0 12px 35px rgba(28,62,40,.08);
      ">
        <h2 style="margin:0 0 8px;color:#285b3c;">تسجيل الدخول</h2>
        <p style="color:#738077;margin:0 0 22px;">
          منصة تشخيص واقع الجمعيات
        </p>

        <div style="margin-bottom:14px;">
          <label style="display:block;margin-bottom:6px;font-weight:700;">
            البريد الإلكتروني
          </label>
          <input id="loginEmail" type="email" style="
            width:100%;
            padding:12px;
            border:1px solid #dce3dc;
            border-radius:10px;
            font-size:15px;
          ">
        </div>

        <div style="margin-bottom:16px;">
          <label style="display:block;margin-bottom:6px;font-weight:700;">
            كلمة المرور
          </label>
          <input id="loginPassword" type="password" style="
            width:100%;
            padding:12px;
            border:1px solid #dce3dc;
            border-radius:10px;
            font-size:15px;
          ">
        </div>

        <button onclick="loginUser()" style="
          width:100%;
          border:0;
          background:#285b3c;
          color:#fff;
          padding:12px;
          border-radius:10px;
          font-size:16px;
          cursor:pointer;
        ">
          تسجيل الدخول
        </button>

        <div id="loginMessage" style="
          margin-top:14px;
          color:#b94242;
          font-size:13px;
          min-height:20px;
        "></div>
      </div>
    </div>
  `;
}

async function loginUser() {
  const email = document.getElementById('loginEmail').value.trim();
  const password = document.getElementById('loginPassword').value;

  const msg = document.getElementById('loginMessage');
  msg.textContent = 'جارٍ تسجيل الدخول...';

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email,
    password
  });

  if (error) {
    msg.textContent = 'تعذر تسجيل الدخول. تحقق من البريد وكلمة المرور.';
    return;
  }

  currentUser = data.user;
  location.reload();

function addMeeting(){db.meetings.push({date:'',title:'',status:'مجدول',discussion:'',tasks:'',knowledge:'',notes:''});saveAll();renderMeetings()}function updMeeting(i,k,v){db.meetings[i][k]=v;saveAll()}function delMeeting(i){db.meetings.splice(i,1);saveAll();renderMeetings()}
function renderCompare(){let a=score100('pre'),b=score100('post'),c=scoreQ('pre'),d=scoreQ('post');compare.innerHTML=`<div class="section-title"><div><h3>النتائج والمقارنة</h3><p class="hint">مقارنة القياس القبلي والبعدي وإظهار مقدار التحسن.</p></div></div><div class="cards"><div class="card kpi"><span>تحسن مؤشرات 100 يوم</span><strong>${b-a>=0?'+':''}${b-a}%</strong></div><div class="card kpi"><span>تحسن المؤشرات النوعية</span><strong>${d-c>=0?'+':''}${d-c}%</strong></div><div class="card kpi"><span>تنفيذ خطة العمل</span><strong>${planProgress()}%</strong></div><div class="card kpi"><span>فجوات باقية</span><strong>${remainingGaps()}</strong></div></div><div class="panel"><h3>المقارنة</h3><div class="bars"><div class="bar"><span>100 يوم — قبلي</span><div class="bar-track"><span style="width:${a}%"></span></div><b>${a}%</b></div><div class="bar"><span>100 يوم — بعدي</span><div class="bar-track"><span style="width:${b}%"></span></div><b>${b}%</b></div><div class="bar"><span>نوعي — قبلي</span><div class="bar-track"><span style="width:${c}%"></span></div><b>${c}%</b></div><div class="bar"><span>نوعي — بعدي</span><div class="bar-track"><span style="width:${d}%"></span></div><b>${d}%</b></div></div></div>`}function remainingGaps(){let n=0;HUNDRED.forEach((x,i)=>{if(+((db.post100[i]||{}).score||0)<4)n++});QUAL.forEach((x,i)=>{if(+((db.postQ[i]||{}).score||0)<4)n++});return n}
function renderReport(){let p=Math.round((score100('pre')+scoreQ('pre'))/2),po=Math.round((score100('post')+scoreQ('post'))/2);report.innerHTML=`<div class="no-print" style="margin-bottom:15px"><button class="btn primary" onclick="window.print()">طباعة / PDF</button></div><article class="report"><h1>تقرير تشخيص واقع الجمعية</h1><p><b>الجمعية:</b> ${db.profile.name||'—'} &nbsp; <b>رقم الترخيص:</b> ${db.profile.license||'—'} &nbsp; <b>المدينة:</b> ${db.profile.city||'—'}</p><div class="report-section"><h2>الملخص التنفيذي</h2><p>بلغت نتيجة التشخيص القبلي الإجمالية <b>${p}%</b>، وبلغت النتيجة البعدية <b>${po}%</b>. وتظهر النتائج حاجة الجمعية إلى معالجة الفجوات ذات الأولوية من خلال خطة العمل التطويرية، مع الاستفادة من عناصر القوة والفرص التي أظهرها التحليل الاستراتيجي.</p></div><div class="report-section"><h2>نتائج القياس</h2><p>مؤشرات 100 يوم: ${score100('pre')}% قبليًا، ${score100('post')}% بعديًا.</p><p>المؤشرات النوعية: ${scoreQ('pre')}% قبليًا، ${scoreQ('post')}% بعديًا.</p></div><div class="report-section"><h2>أهم الفجوات القبلية</h2><ol>${getGaps().slice(0,10).map(x=>`<li>${x.item} — ${x.axis}</li>`).join('')||'<li>لم يكتمل القياس القبلي.</li>'}</ol></div><div class="report-section"><h2>خطة العمل</h2><p>عدد الأهداف التطويرية: ${db.plan.length}، ومتوسط الإنجاز: ${planProgress()}%.</p><ol>${db.plan.slice(0,10).map(x=>`<li><b>${x.goal}</b> — ${x.status} (${x.progress||0}%)</li>`).join('')}</ol></div><div class="report-section"><h2>التوجه العام</h2><p>${generalDirection()}</p></div><div class="report-section"><h2>التوصيات</h2><ol><li>استكمال الفجوات الحرجة قبل التوسع في البرامج والمشروعات.</li><li>ربط خطة العمل بالمسؤوليات والمواعيد والشواهد.</li><li>مراجعة التقدم دوريًا وتحديث المؤشرات.</li><li>اعتماد التوجهات المستخرجة من TOWS بما يناسب واقع الجمعية.</li><li>إعادة القياس بعد انتهاء فترة التطوير وتوثيق التحسن.</li></ol></div></article>`}
function renderEvidence(){evidence.innerHTML=`<div class="section-title"><div><h3>المرفقات والشواهد</h3><p class="hint">سجل مركزي للوثائق والروابط الداعمة للقياس والتنفيذ.</p></div><button class="btn primary" onclick="addEvidence()">إضافة شاهد</button></div>${db.evidence.length?`<div class="table-wrap"><table><tr><th>العنوان</th><th>النوع</th><th>الرابط / المرجع</th><th>مرتبط بـ</th><th>الحالة</th><th></th></tr>${db.evidence.map((x,i)=>`<tr>${['title','type','link','related','status'].map(k=>`<td><input value="${esc(x[k]||'')}" oninput="updEvidence(${i},'${k}',this.value)"></td>`).join('')}<td><button class="btn danger" onclick="delEvidence(${i})">حذف</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">لا توجد شواهد مسجلة.</div>'}`}
function addEvidence(){db.evidence.push({title:'',type:'',link:'',related:'',status:'متاح'});saveAll();renderEvidence()}function updEvidence(i,k,v){db.evidence[i][k]=v;saveAll()}function delEvidence(i){db.evidence.splice(i,1);saveAll();renderEvidence()}
function exportData(){let b=new Blob([JSON.stringify(db,null,2)],{type:'application/json'}),a=document.createElement('a');a.href=URL.createObjectURL(b);a.download=`تشخيص-${db.profile.name||'جمعية'}.json`;a.click();URL.revokeObjectURL(a.href)}function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{db=JSON.parse(r.result);saveAll();renderHome();toast('تم استيراد البيانات')}catch{alert('ملف غير صالح')}};r.readAsText(f)}
initNav();renderHome();setInterval(()=>saveAll(),30000);
</script>
<script>
/* الإصدار 2: تحسين سلامة القياس، الترابط، والواقعية التشغيلية */
const APP_VERSION='8.0';
function normalizeDb(raw){
 const b=blank(); raw=raw&&typeof raw==='object'?raw:{};
 Object.assign(b,raw); b.profile=b.profile||{}; b.pre100=b.pre100||{}; b.post100=b.post100||{}; b.preQ=b.preQ||{}; b.postQ=b.postQ||{};
 b.plan=Array.isArray(b.plan)?b.plan:[]; b.operations=Array.isArray(b.operations)?b.operations:[]; b.meetings=Array.isArray(b.meetings)?b.meetings:[]; b.evidence=Array.isArray(b.evidence)?b.evidence:[];
 b.swot=b.swot||{S:[],W:[],O:[],T:[]}; ['S','W','O','T'].forEach(k=>b.swot[k]=Array.isArray(b.swot[k])?b.swot[k]:[]);
 b.tows=b.tows||{SO:[],WO:[],ST:[],WT:[]}; ['SO','WO','ST','WT'].forEach(k=>b.tows[k]=Array.isArray(b.tows[k])?b.tows[k]:[]);
 b.version=APP_VERSION; return b;
}
try{db=normalizeDb(db)}catch(e){db=normalizeDb(null)}
function answeredCount(stage,type){let o=getAssessObj(stage,type);return Object.values(o).filter(x=>x&&Number(x.score)>=0&&Number(x.score)<=5).length}
function assessmentCompletion(stage,type){let total=type==='100'?HUNDRED.length:QUAL.length;return pct(answeredCount(stage,type),total)}
function scoreValue(stage,type){let o=getAssessObj(stage,type),vals=Object.values(o).filter(x=>x&&Number(x.score)>=0&&Number(x.score)<=5).map(x=>Number(x.score));return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/(vals.length*5)*100):null}
function score100(stage){return scoreValue(stage,'100')}
function scoreQ(stage){return scoreValue(stage,'Q')}
function shown(v){return v===null?'—':v+'%'}
function overall(stage){let vals=[score100(stage),scoreQ(stage)].filter(v=>v!==null);return vals.length?Math.round(vals.reduce((a,b)=>a+b,0)/vals.length):null}
function journey(){let steps=[profileCompletion()>=70,assessmentCompletion('pre','100')===100,assessmentCompletion('pre','Q')===100,db.plan.length>0,(first('S').length+first('W').length+first('O').length+first('T').length)>=4,db.operations.length>0,assessmentCompletion('post','100')===100,assessmentCompletion('post','Q')===100];return pct(steps.filter(Boolean).length,steps.length)}
function scoreLabel(n,type){if(n===0)return 'غير موجود';if(n===1)return 'بداية أولية';if(n===2)return 'موجود جزئيًا';if(n===3)return type==='Q'?'ممارسة مستقرة':'موجود ومنظم';if(n===4)return 'مطبق وموثق';return 'متكامل ومحسن'}
function renderAssessment(stage){let target=stage==='pre'?pre:post;let title=stage==='pre'?'القياس القبلي':'القياس البعدي';target.innerHTML=`<div class="section-title"><div><h3>${title}</h3><p class="hint">جميع مؤشرات ملف Excel مدرجة كما هي، مع فصل نتيجة الأداء عن نسبة اكتمال التقييم.</p></div><div class="readiness"><span class="badge">100 يوم: ${shown(score100(stage))}</span><span class="badge">اكتماله ${assessmentCompletion(stage,'100')}%</span><span class="badge">نوعي: ${shown(scoreQ(stage))}</span><span class="badge">اكتماله ${assessmentCompletion(stage,'Q')}%</span></div></div><div class="notice">لا تعتمد النتيجة النهائية قبل استكمال جميع المؤشرات والتحقق من الشواهد. الدرجة تقيس مستوى التطبيق، وليست مجرد وجود وثيقة.</div><div class="score-legend">${[0,1,2,3,4,5].map(n=>`<span><b>${n}</b> ${scoreLabel(n,'100')}</span>`).join('')}</div><div class="tabs"><button class="tab active" onclick="assessmentTab('${stage}','h',this)">مؤشرات 100 يوم</button><button class="tab" onclick="assessmentTab('${stage}','q',this)">المؤشرات النوعية</button></div><div id="assessBody"></div>`;assessmentTab(stage,'h')}
function measureRow(stage,type,i,item,evidence){let obj=getAssessObj(stage,type),v=obj[i]||{};let descriptions='';if(type==='Q'){let q=QUAL[i];descriptions=`<div class="quality-grid"><div><b>التأسيس</b><br>${q.foundation}</div><div><b>الممارسة</b><br>${q.practice}</div><div><b>التميز</b><br>${q.excellence}</div></div>`}return `<div class="measure"><div><b>${item}</b><div class="hint" style="white-space:pre-line;margin-top:5px">${type==='100'?evidence:''}</div>${descriptions}</div><div class="score">${[0,1,2,3,4,5].map(n=>`<button title="${scoreLabel(n,type)}" class="${+v.score===n?'sel':''}" onclick="setScore('${stage}','${type}',${i},${n})">${n}</button>`).join('')}<button class="na" onclick="clearScore('${stage}','${type}',${i})">غير مقيم</button></div><input placeholder="الاحتياج التطويري" value="${esc(v.need||'')}" oninput="setAssess('${stage}','${type}',${i},'need',this.value)"><input placeholder="الشاهد / الرابط" value="${esc(v.evidence||'')}" oninput="setAssess('${stage}','${type}',${i},'evidence',this.value)"><input placeholder="ملاحظات التحقق" value="${esc(v.notes||'')}" oninput="setAssess('${stage}','${type}',${i},'notes',this.value)"><select onchange="setAssess('${stage}','${type}',${i},'verified',this.value)">${['غير مراجع','شاهد مرفق','تم التحقق','الشاهد غير كافٍ'].map(z=>`<option ${v.verified===z?'selected':''}>${z}</option>`).join('')}</select></div>`}
function clearScore(stage,type,i){let o=getAssessObj(stage,type);if(o[i])delete o[i].score;saveAll();renderAssessment(stage)}
function getGaps(){let a=[];HUNDRED.forEach((x,i)=>{let v=db.pre100[i]||{};if(Number.isFinite(Number(v.score))&&Number(v.score)<4)a.push({key:`100-${i}`,source:'100 يوم',axis:x.axis,item:x.item,score:Number(v.score),need:v.need,evidence:x.evidence,verified:v.verified})});QUAL.forEach((x,i)=>{let v=db.preQ[i]||{};if(Number.isFinite(Number(v.score))&&Number(v.score)<4)a.push({key:`Q-${i}`,source:'نوعي',axis:x.domain,item:x.indicator,score:Number(v.score),need:v.need,evidence:'شاهد يثبت مستوى الممارسة',verified:v.verified})});return a.sort((a,b)=>a.score-b.score||a.axis.localeCompare(b.axis,'ar'))}
function renderResults(){let p=overall('pre'),complete=Math.round((assessmentCompletion('pre','100')+assessmentCompletion('pre','Q'))/2),g=getGaps();if(p===null){results.innerHTML='<div class="panel empty">ابدأ القياس القبلي لإظهار النتائج.</div>';return}let lv=level(p),axes={};HUNDRED.forEach((x,i)=>{let v=db.pre100[i];if(v&&Number.isFinite(Number(v.score)))(axes[x.axis]??=[]).push(Number(v.score))});QUAL.forEach((x,i)=>{let v=db.preQ[i];if(v&&Number.isFinite(Number(v.score)))(axes[x.domain]??=[]).push(Number(v.score))});results.innerHTML=`<div class="section-title"><div><h3>نتائج التشخيص القبلي</h3><p class="hint">نتائج مبنية على المؤشرات المقيمة فقط، مع إظهار اكتمال التقييم لمنع الاستنتاجات المضللة.</p></div><span class="badge ${lv[1]}">${lv[0]} — ${p}%</span></div>${complete<100?`<div class="notice danger">التقييم مكتمل بنسبة ${complete}% فقط؛ النتيجة أولية ولا تصلح للاعتماد النهائي.</div>`:'<div class="notice ok">تم استكمال جميع المؤشرات. راجع حالة الشواهد قبل اعتماد التقرير.</div>'}<div class="cards"><div class="card kpi"><span>مؤشرات 100 يوم</span><strong>${shown(score100('pre'))}</strong></div><div class="card kpi"><span>المؤشرات النوعية</span><strong>${shown(scoreQ('pre'))}</strong></div><div class="card kpi"><span>الفجوات المقيمة</span><strong>${g.length}</strong></div><div class="card kpi"><span>الفجوات الحرجة</span><strong>${g.filter(x=>x.score<=1).length}</strong></div></div><div class="panel"><h3>نتائج المحاور</h3><div class="bars">${Object.entries(axes).map(([k,v])=>{let n=Math.round(v.reduce((a,b)=>a+b,0)/(v.length*5)*100);return `<div class="bar"><span>${k} <small>(${v.length} مقيم)</small></span><div class="bar-track"><span style="width:${n}%"></span></div><b>${n}%</b></div>`}).join('')}</div></div><div class="panel"><div class="section-title"><h3>أهم الفجوات</h3><button class="btn primary" onclick="generatePlan()">تحديث خطة العمل من الفجوات</button></div>${g.length?`<div class="table-wrap"><table><tr><th>الأولوية</th><th>المحور</th><th>الفجوة</th><th>الدرجة</th><th>التحقق</th><th>الاحتياج التطويري</th><th>الشاهد المطلوب</th></tr>${g.map((x,i)=>`<tr><td>${i+1}</td><td>${x.axis}</td><td>${x.item}</td><td><span class="badge ${x.score<=1?'danger':x.score<=3?'warn':'ok'}">${x.score}/5</span></td><td>${x.verified||'غير مراجع'}</td><td>${x.need||autoNeed(x.item)}</td><td>${x.evidence}</td></tr>`).join('')}</table></div>`:'<div class="empty">لا توجد فجوات ضمن البنود المقيمة.</div>'}</div>`}
function generatePlan(){let gaps=getGaps(),byKey=new Map(db.plan.filter(x=>x.sourceKey).map((x,i)=>[x.sourceKey,i]));gaps.forEach(g=>{let row={sourceKey:g.key,gap:g.item,axis:g.axis,goal:autoGoal(g.item),initiative:g.need||autoNeed(g.item),advisor:'التوجيه والتحكيم وتوفير النماذج والمتابعة',owner:'',cost:'',start:'',end:'',progress:0,status:'لم يبدأ',evidence:g.evidence,notes:'',priority:g.score<=1?'حرجة':g.score<=2?'مرتفعة':'متوسطة'};if(byKey.has(g.key)){let i=byKey.get(g.key);db.plan[i]={...row,...db.plan[i],priority:row.priority,evidence:db.plan[i].evidence||row.evidence}}else db.plan.push(row)});saveAll();toast('تم تحديث الأهداف التطويرية وربطها بالفجوات');showPage('plan',navButton('plan'))}
function updPlan(i,k,v){if(k==='progress'){v=Math.max(0,Math.min(100,Number(v)||0));if(v===100){db.plan[i].status='مكتمل'}else if(v>0&&db.plan[i].status==='لم يبدأ'){db.plan[i].status='قيد التنفيذ'}}db.plan[i][k]=v;saveAll();renderPlan()}
function delPlan(i){if(confirm('هل تريد حذف هذا الهدف؟')){db.plan.splice(i,1);saveAll();renderPlan()}}
function createOperationsFromPlan(){let existing=new Set(db.operations.map(x=>x.planKey).filter(Boolean));db.plan.forEach((p,i)=>{let key=p.sourceKey||`manual-${i}`;if(!existing.has(key))db.operations.push({planKey:key,goal:p.goal,activity:p.initiative,output:p.evidence,indicator:'نسبة إنجاز المخرج واعتماده',target:'100%',owner:p.owner||'',start:p.start||'',end:p.end||'',progress:p.progress||0,status:p.status||'لم يبدأ',evidence:'',notes:''})});saveAll();renderOperations();toast('تم إنشاء الأنشطة من خطة العمل')}
function renderOperations(){operations.innerHTML=`<div class="section-title"><div><h3>الخطة التشغيلية</h3><p class="hint">امتداد تنفيذي لخطة العمل؛ كل نشاط مرتبط بهدف ومخرج ومؤشر وشاهد.</p></div><div><button class="btn" onclick="createOperationsFromPlan()">إنشاء من خطة العمل</button> <button class="btn primary" onclick="addOperation()">إضافة نشاط</button></div></div>${db.operations.length?`<div class="table-wrap"><table><tr><th>الهدف المرتبط</th><th>النشاط</th><th>المخرج</th><th>المؤشر</th><th>المستهدف</th><th>المسؤول</th><th>البداية</th><th>النهاية</th><th>الإنجاز</th><th>الحالة</th><th>الشاهد</th><th></th></tr>${db.operations.map((x,i)=>`<tr>${['goal','activity','output','indicator','target','owner','start','end','progress'].map(k=>`<td><input ${k==='start'||k==='end'?'type="date"':k==='progress'?'type="number" min="0" max="100"':''} value="${esc(x[k]??'')}" oninput="updOperation(${i},'${k}',this.value)"></td>`).join('')}<td><select onchange="updOperation(${i},'status',this.value)">${['لم يبدأ','قيد التنفيذ','متعثر','مكتمل'].map(z=>`<option ${x.status===z?'selected':''}>${z}</option>`).join('')}</select></td><td><input value="${esc(x.evidence||'')}" oninput="updOperation(${i},'evidence',this.value)"></td><td><button class="btn danger" onclick="delOperation(${i})">حذف</button></td></tr>`).join('')}</table></div>`:'<div class="panel empty">لم تتم إضافة أنشطة تشغيلية.</div>'}`}
function updOperation(i,k,v){if(k==='progress'){v=Math.max(0,Math.min(100,Number(v)||0));if(v===100)db.operations[i].status='مكتمل';else if(v>0&&db.operations[i].status==='لم يبدأ')db.operations[i].status='قيد التنفيذ'}db.operations[i][k]=v;saveAll()}
function delOperation(i){if(confirm('هل تريد حذف النشاط؟')){db.operations.splice(i,1);saveAll();renderOperations()}}
function firstObj(k){return db.swot[k].filter(x=>x.text)}
function makeTows(text,k,a,b){return {text,type:k,sourceA:a,sourceB:b,relevance:3,feasibility:3,priority:'متوسطة',approved:false}}
function generateTOWS(){let S=firstObj('S'),W=firstObj('W'),O=firstObj('O'),T=firstObj('T');if(!S.length&&!W.length&&!O.length&&!T.length){alert('أدخل عناصر SWOT أولًا');return}db.tows.SO=S.flatMap(s=>O.slice(0,3).map(o=>makeTows(`توظيف ${s.text} لاستثمار ${o.text}`,'SO',s.text,o.text))).slice(0,8);db.tows.WO=W.flatMap(w=>O.slice(0,3).map(o=>makeTows(`معالجة ${w.text} بالاستفادة من ${o.text}`,'WO',w.text,o.text))).slice(0,8);db.tows.ST=S.flatMap(s=>T.slice(0,3).map(t=>makeTows(`استخدام ${s.text} للحد من أثر ${t.text}`,'ST',s.text,t.text))).slice(0,8);db.tows.WT=W.flatMap(w=>T.slice(0,3).map(t=>makeTows(`تقليل ${w.text} ووضع ضوابط لمواجهة ${t.text}`,'WT',w.text,t.text))).slice(0,8);saveAll();renderSWOT();toast('تم توليد مصفوفة TOWS القابلة للتحرير والاعتماد')}
function normalizeTowsItem(z,k){return typeof z==='string'?makeTows(z,k,'',''):z}
function updTows(k,i,f,v){db.tows[k][i]=normalizeTowsItem(db.tows[k][i],k);db.tows[k][i][f]=f==='relevance'||f==='feasibility'?Number(v):v;saveAll()}
function addTowsToPlan(k,i){let z=normalizeTowsItem(db.tows[k][i],k);db.plan.push({sourceKey:`TOWS-${k}-${Date.now()}`,gap:'توجه ناتج من التحليل الاستراتيجي',axis:'التوجه العام',goal:z.text,initiative:'تحويل التوجه إلى مبادرة محددة بعد مراجعته واعتماده',advisor:'التحكيم والتوجيه',owner:'',cost:'',start:'',end:'',progress:0,status:'لم يبدأ',evidence:'قرار اعتماد التوجه أو المبادرة الناتجة',notes:`${k} | الصلة ${z.relevance}/5 | القابلية ${z.feasibility}/5`,priority:z.priority||'متوسطة'});saveAll();toast('تمت إضافة التوجه إلى خطة العمل')}
function towsCard(k,t){let rows=(db.tows[k]||[]).map((raw,i)=>{let z=normalizeTowsItem(raw,k);return `<div class="tows-row"><textarea oninput="updTows('${k}',${i},'text',this.value)">${z.text||''}</textarea><div class="tows-meta"><select onchange="updTows('${k}',${i},'relevance',this.value)">${[1,2,3,4,5].map(n=>`<option value="${n}" ${z.relevance==n?'selected':''}>صلة ${n}/5</option>`).join('')}</select><select onchange="updTows('${k}',${i},'feasibility',this.value)">${[1,2,3,4,5].map(n=>`<option value="${n}" ${z.feasibility==n?'selected':''}>قابلية ${n}/5</option>`).join('')}</select><select onchange="updTows('${k}',${i},'priority',this.value)">${['حرجة','مرتفعة','متوسطة','منخفضة'].map(p=>`<option ${z.priority===p?'selected':''}>${p}</option>`).join('')}</select><button class="btn link-btn" onclick="addTowsToPlan('${k}',${i})">إضافة للخطة</button></div></div>`}).join('');return `<div class="card"><b>${t}</b>${rows||'<p class="hint">تظهر المقترحات بعد التحليل.</p>'}</div>`}
function renderSWOT(){swot.innerHTML=`<div class="section-title"><div><h3>التحليل الاستراتيجي SWOT وTOWS</h3><p class="hint">يعطي توجهًا عامًا للجمعية؛ جميع المخرجات مقترحات تحتاج مراجعة واعتمادًا بشريًا.</p></div><button class="btn primary" onclick="generateTOWS()">تحليل وتوليد TOWS</button></div><div class="notice">لا تُعد الصياغات المولدة خطة استراتيجية. قيّم الصلة وقابلية التنفيذ، ثم أضف التوجهات المناسبة إلى خطة العمل.</div><div class="swot">${[['S','نقاط القوة'],['W','نقاط الضعف'],['O','الفرص'],['T','التهديدات']].map(x=>swotBox(x[0],x[1])).join('')}</div><div class="panel"><h3>مصفوفة استخراج التوجهات TOWS</h3><div class="grid2">${towsCard('SO','قوة + فرص')+towsCard('WO','ضعف + فرص')+towsCard('ST','قوة + تهديدات')+towsCard('WT','ضعف + تهديدات')}</div></div><div class="panel"><h3>التوجه العام المقترح</h3><div class="analysis">${generalDirection()}</div></div>`}
function renderCompare(){let a=score100('pre'),b=score100('post'),c=scoreQ('pre'),d=scoreQ('post');let ready=assessmentCompletion('post','100')===100&&assessmentCompletion('post','Q')===100;let diff=(x,y)=>x===null||y===null?'—':`${y-x>=0?'+':''}${y-x}%`;compare.innerHTML=`<div class="section-title"><div><h3>النتائج والمقارنة</h3><p class="hint">لا تعتمد المقارنة إلا بعد اكتمال القياسين على المؤشرات نفسها.</p></div></div>${ready?'<div class="notice ok">القياس البعدي مكتمل.</div>':'<div class="notice danger">القياس البعدي غير مكتمل؛ المقارنة الحالية أولية.</div>'}<div class="cards"><div class="card kpi"><span>تحسن مؤشرات 100 يوم</span><strong>${diff(a,b)}</strong></div><div class="card kpi"><span>تحسن المؤشرات النوعية</span><strong>${diff(c,d)}</strong></div><div class="card kpi"><span>تنفيذ خطة العمل</span><strong>${planProgress()}%</strong></div><div class="card kpi"><span>فجوات باقية</span><strong>${remainingGaps()}</strong></div></div><div class="panel"><h3>المقارنة</h3><div class="bars">${[['100 يوم — قبلي',a],['100 يوم — بعدي',b],['نوعي — قبلي',c],['نوعي — بعدي',d]].map(([t,v])=>`<div class="bar"><span>${t}</span><div class="bar-track"><span style="width:${v||0}%"></span></div><b>${shown(v)}</b></div>`).join('')}</div></div>`}
function remainingGaps(){let n=0;HUNDRED.forEach((x,i)=>{let v=db.post100[i];if(v&&Number.isFinite(Number(v.score))&&Number(v.score)<4)n++});QUAL.forEach((x,i)=>{let v=db.postQ[i];if(v&&Number.isFinite(Number(v.score))&&Number(v.score)<4)n++});return n}
function importData(e){let f=e.target.files[0];if(!f)return;let r=new FileReader();r.onload=()=>{try{let parsed=JSON.parse(r.result);if(!parsed||typeof parsed!=='object')throw new Error();db=normalizeDb(parsed);saveAll();renderHome();toast('تم استيراد البيانات والتحقق من بنيتها')}catch{alert('ملف غير صالح أو غير متوافق')}};r.readAsText(f);e.target.value=''}
function resetData(){if(confirm('سيتم حذف جميع بيانات هذه النسخة من المتصفح. هل أنت متأكد؟')){db=normalizeDb(null);saveAll();renderHome();toast('تم بدء تشخيص جديد')}}
function addTopReset(){let a=document.querySelector('.actions');if(a&&!document.getElementById('resetBtn'))a.insertAdjacentHTML('afterbegin','<button id="resetBtn" class="btn danger" onclick="resetData()">تشخيص جديد</button>')}
function renderHome(){let j=journey(),pre=overall('pre');home.innerHTML=`<div class="hero"><div><h3>${db.profile.name||'مرحبًا بكم في منصة تشخيص واقع الجمعيات'}</h3><p>رحلة مترابطة تبدأ بالبيانات والقياس، ثم تستخرج الفجوات وخطة العمل، وتنتقل إلى SWOT وTOWS والخطة التشغيلية والمتابعة، وتنتهي بقياس التحسن.</p><button class="btn" onclick="showPage('profile',navButton('profile'))">ابدأ / استكمل الرحلة</button></div><div class="journey"><b>اكتمال رحلة الجمعية</b><h2>${j}%</h2><div class="progress"><span style="width:${j}%"></span></div><p>الإصدار ${APP_VERSION} — آخر تحديث: ${db.updated?new Date(db.updated).toLocaleString('ar-SA'):'لم يتم الحفظ بعد'}</p></div></div><div class="cards"><div class="card kpi"><span>نتيجة التشخيص القبلي</span><strong>${shown(pre)}</strong><small>اكتمال ${Math.round((assessmentCompletion('pre','100')+assessmentCompletion('pre','Q'))/2)}%</small></div><div class="card kpi"><span>الفجوات المقيمة</span><strong>${getGaps().length}</strong></div><div class="card kpi"><span>الأهداف التطويرية</span><strong>${db.plan.length}</strong></div><div class="card kpi"><span>تنفيذ خطة العمل</span><strong>${planProgress()}%</strong></div></div><div class="panel"><h3>سلامة التكامل</h3><div class="grid3">${[['البيانات الأساسية',profileCompletion()>=70],['القياس القبلي',assessmentCompletion('pre','100')===100&&assessmentCompletion('pre','Q')===100],['خطة العمل',db.plan.length>0],['SWOT وTOWS',(first('S').length+first('W').length+first('O').length+first('T').length)>=4],['الخطة التشغيلية',db.operations.length>0],['القياس البعدي',assessmentCompletion('post','100')===100&&assessmentCompletion('post','Q')===100]].map(([t,ok])=>`<div class="card"><span class="status-dot ${ok?'green':'amber'}"></span><b>${t}</b><p class="hint">${ok?'مكتمل أو مفعّل':'يحتاج استكمالًا'}</p></div>`).join('')}</div></div>`}
addTopReset();saveAll();renderHome();
</script>

<script>
/* طبقة أحداث آمنة للإصدارات التي تمنع معالجات onclick المضمنة */
(function(){
  'use strict';
  function splitArgs(text){
    const out=[]; let cur='', quote=null, depth=0, esc=false;
    for(const ch of text){
      if(esc){cur+=ch;esc=false;continue}
      if(ch==='\\'){cur+=ch;esc=true;continue}
      if(quote){cur+=ch;if(ch===quote)quote=null;continue}
      if(ch==="'"||ch==='"'){quote=ch;cur+=ch;continue}
      if(ch==='('||ch==='['||ch==='{')depth++;
      if(ch===')'||ch===']'||ch==='}')depth--;
      if(ch===','&&depth===0){out.push(cur.trim());cur='';continue}
      cur+=ch;
    }
    if(cur.trim())out.push(cur.trim());
    return out;
  }
  function valueOf(token, el, ev){
    token=token.trim();
    if(token==='this')return el;
    if(token==='this.value')return el.value;
    if(token==='this.checked')return el.checked;
    if(token==='event')return ev;
    if(token==='true')return true;
    if(token==='false')return false;
    if(token==='null')return null;
    if(token==='undefined')return undefined;
    if(/^[-+]?\d+(\.\d+)?$/.test(token))return Number(token);
    const q=token.match(/^(['"])([\s\S]*)\1$/);
    if(q)return q[2].replace(/\\'/g,"'").replace(/\\"/g,'"').replace(/\\n/g,'\n');
    const qs=token.match(/^document\.querySelectorAll\((['"])(.*?)\1\)\[(\d+)\]$/);
    if(qs)return document.querySelectorAll(qs[2])[Number(qs[3])];
    const ge=token.match(/^document\.getElementById\((['"])(.*?)\1\)$/);
    if(ge)return document.getElementById(ge[2]);
    return token;
  }
  function dispatch(code, el, ev){
    code=(code||'').trim().replace(/;$/,'');
    let m=code.match(/^document\.getElementById\((['"])(.*?)\1\)\.click\(\)$/);
    if(m){const target=document.getElementById(m[2]);if(target)target.click();return}
    if(code==='window.print()'){window.print();return}
    m=code.match(/^([A-Za-z_$][\w$]*)\((.*)\)$/s);
    if(!m)throw new Error('معالج غير معروف: '+code);
    const fn=window[m[1]];
    if(typeof fn!=='function')throw new Error('الدالة غير متاحة: '+m[1]);
    const args=m[2].trim()?splitArgs(m[2]).map(t=>valueOf(t,el,ev)):[];
    return fn.apply(window,args);
  }
  function bind(type, attr){
    document.addEventListener(type,function(ev){
      const el=ev.target.closest('['+attr+']');
      if(!el)return;
      const code=el.getAttribute(attr);
      // منع تشغيل المعالج المضمن مرة ثانية في المتصفحات التي تسمح به
      ev.stopImmediatePropagation();
      if(type==='click')ev.preventDefault();
      try{dispatch(code,el,ev)}catch(err){
        console.error(err);
        const msg='تعذر تنفيذ الأمر: '+(err.message||err);
        if(typeof window.toast==='function')window.toast(msg);else alert(msg);
      }
    },true);
  }
  bind('click','onclick'); bind('input','oninput'); bind('change','onchange');

  function runSelfTest(){
    const functions=['showPage','renderAssessment','setScore','clearScore','addPlan','generatePlan','addSwot','generateTOWS','addOperation','createOperationsFromPlan','addMeeting','addEvidence','exportData','importData','saveAll'];
    const pages=['home','profile','pre','results','plan','swot','operations','meetings','compare','report','evidence'];
    const missingFns=functions.filter(n=>typeof window[n]!=='function');
    const missingPages=pages.filter(n=>!document.getElementById(n));
    const buttons=[...document.querySelectorAll('[onclick]')];
    let invalidHandlers=[];
    for(const b of buttons){
      const c=b.getAttribute('onclick')||'';
      const m=c.match(/^([A-Za-z_$][\w$]*)\(/);
      if(m&&typeof window[m[1]]!=='function')invalidHandlers.push(m[1]);
    }
    invalidHandlers=[...new Set(invalidHandlers)];
    const ok=!missingFns.length&&!missingPages.length&&!invalidHandlers.length&&(typeof HUNDRED!=='undefined')&&(typeof QUAL!=='undefined')&&Array.isArray(HUNDRED)&&Array.isArray(QUAL);
    const details=[
      'الدوال الأساسية: '+(missingFns.length?'مفقود '+missingFns.join('، '):'سليمة'),
      'صفحات الرحلة: '+(missingPages.length?'مفقود '+missingPages.join('، '):'سليمة'),
      'روابط الأزرار: '+(invalidHandlers.length?'غير سليمة '+invalidHandlers.join('، '):'سليمة'),
      'مؤشرات 100 يوم: '+((typeof HUNDRED!=='undefined'&&HUNDRED.length)||0),
      'المؤشرات النوعية: '+((typeof QUAL!=='undefined'&&QUAL.length)||0),
      'التخزين: '+(safeStore(db)?'متاح':'وضع جلسة مؤقت')
    ];
    alert((ok?'✓ اجتازت المنصة الفحص الوظيفي الأولي':'⚠ توجد ملاحظات تحتاج معالجة')+'\n\n'+details.join('\n'));
    return {ok,missingFns,missingPages,invalidHandlers};
  }
  window.runSelfTest=runSelfTest;
  function addHealthButton(){
    const a=document.querySelector('.actions');
    if(a&&!document.getElementById('healthBtn')){
      const b=document.createElement('button');b.id='healthBtn';b.className='btn';b.type='button';b.textContent='فحص المنصة';
      b.addEventListener('click',runSelfTest);a.prepend(b);
    }
  }
  if(document.readyState==='loading')document.addEventListener('DOMContentLoaded',addHealthButton);else addHealthButton();
})();
</script>

function compareMeasureRow(type,i,item,guide){
 const preV=(type==='100'?db.pre100:db.preQ)[i]||{};const postV=(type==='100'?db.post100:db.postQ)[i]||{};
 const ps=itemScore(type==='100'?db.pre100:db.preQ,i),qs=itemScore(type==='100'?db.post100:db.postQ,i);const delta=(qs??0)-(ps??0), has=ps!==null&&qs!==null;

function inferTags(text){const sets={leadership:['مجلس','قياد','قرار','حوكمة','صلاحيات'],people:['فريق','موظف','كوادر','كفاءات','متطوع'],finance:['مالي','تبرع','مانح','دخل','موارد','استثمار','تكلفة','سيولة'],digital:['تقني','رقمي','منصة','بيانات','نظام','إلكتروني'],programs:['برنامج','خدمة','مستفيد','أثر','احتياج'],partnerships:['شراكة','علاقات','جامعة','شركة','جهات'],compliance:['لوائح','أنظمة','امتثال','ترخيص','مخالفات'],reputation:['سمعة','ثقة','إعلام','هوية','صورة ذهنية'],operations:['تشغيل','عمليات','إجراءات','جودة','مقر']};return Object.entries(sets).filter(([k,ws])=>ws.some(w=>text.includes(w))).map(([k])=>k)}
function pairScore(a,b){const A=inferTags(a.text),B=inferTags(b.text);const intersect=A.filter(x=>B.includes(x)).length;const imp={مرتفع:3,متوسط:2,منخفض:1};return intersect*5+(imp[a.impact]||2)+(imp[b.impact]||2)+(a.category===b.category?2:0)}
function strategicAction(tags,type){const tag=tags[0]||'operations';const actions={finance:'بناء مبادرة لتنمية الموارد وتنويع الدخل مع مستهدف مالي واضح',digital:'تنفيذ مسار تحول رقمي وأتمتة العمليات ذات الأولوية',people:'إطلاق برنامج استقطاب وتطوير وتمكين للكفاءات والمتطوعين',programs:'تطوير برنامج نوعي مبني على الاحتياج ومؤشرات النتائج والأثر',partnerships:'بناء شراكة محددة القيمة والالتزامات والعوائد',compliance:'تنفيذ خطة امتثال وإغلاق فجوات مع سجل شواهد ومسؤوليات',reputation:'تطوير الاتصال المؤسسي وإبراز الأثر وتعزيز الثقة',leadership:'تعزيز الحوكمة وصنع القرار والمتابعة المؤسسية',operations:'تحسين العمليات الأساسية وتوثيقها وقياس كفاءتها'};return actions[tag]||actions.operations}
function controlAction(tags){const tag=tags[0]||'operations';return {finance:'تنويع مصادر الدخل، بناء احتياطي، وضبط المصروفات',digital:'تعزيز النسخ الاحتياطي والصلاحيات والأمن السيبراني',people:'بناء بدائل وظيفية ونقل المعرفة وخطة إحلال',programs:'تنفيذ تجريبي مرحلي وقياس النتائج قبل التوسع',partnerships:'تنويع الشركاء وتوثيق الالتزامات ومتابعة العوائد',compliance:'تحديث سجل المتطلبات ومراجعة الامتثال دوريًا',reputation:'تفعيل إدارة السمعة والشكاوى وخطة الاستجابة',leadership:'توضيح الصلاحيات وتفعيل الرقابة وإدارة المخاطر',operations:'بناء خطة استمرارية وتحسين الإجراءات الحرجة'}[tag]}
function makeExpertTows(type,a,b){const tags=[...new Set([...inferTags(a.text),...inferTags(b.text)])];let text,rationale;if(type==='SO'){text=`توظيف «${a.text}» من خلال ${strategicAction(tags,type)} للاستفادة من «${b.text}».`;rationale='الربط يستثمر قدرة داخلية قائمة في فرصة خارجية متاحة، مع تحويلها إلى مبادرة قابلة للقياس.'}else if(type==='WO'){text=`معالجة «${a.text}» عبر ${strategicAction(tags,type)} مستفيدين من «${b.text}».`;rationale='الفرصة الخارجية توفر موردًا أو قناة تساعد على سد الضعف الداخلي بدل الاكتفاء بوصفه.'}else if(type==='ST'){text=`تفعيل «${a.text}» للحد من أثر «${b.text}» من خلال ${controlAction(tags)}.`;rationale='استخدام عنصر القوة كضابط وقائي يقلل احتمالية التهديد أو أثره.'}else{text=`تقليل التعرض الناتج عن «${a.text}» أمام «${b.text}» من خلال ${controlAction(tags)} وتنفيذ مرحلي محافظ.`;rationale='الربط يجمع بين معالجة الضعف وتقليل المخاطر قبل التوسع.'}const p=pairScore(a,b);return {text,type,sourceA:a.text,sourceB:b.text,rationale,initiative:strategicAction(tags,type),kpi:tags.includes('finance')?'قيمة الإيرادات المتنوعة ونسبة الاعتماد على أكبر مصدر':tags.includes('people')?'نسبة تغطية الأدوار الحرجة واستبقاء الكفاءات':tags.includes('digital')?'نسبة العمليات المؤتمتة وحوادث البيانات':tags.includes('programs')?'نسبة تحقيق نتائج البرنامج ورضا المستفيدين':'نسبة تنفيذ المبادرة وتحقيق المخرج',target:'تحديد خط الأساس ثم مستهدف خلال 100 يوم',owner:tags.includes('finance')?'تنمية الموارد/المالية':tags.includes('digital')?'التقنية/التحول الرقمي':tags.includes('people')?'الموارد البشرية':'المدير التنفيذي والوحدة المعنية',horizon:p>=12?'100 يوم':'6-12 شهر',relevance:Math.min(5,Math.max(3,Math.round(p/3))),feasibility:3,priority:p>=12?'مرتفعة':'متوسطة',approved:false}}
function topPairs(A,B,limit=4){let pairs=[];A.forEach(a=>B.forEach(b=>pairs.push({a,b,score:pairScore(a,b)})));return pairs.sort((x,y)=>y.score-x.score).slice(0,limit)}
function generateTOWS(){const S=firstObj('S'),W=firstObj('W'),O=firstObj('O'),T=firstObj('T');if(!S.length&&!W.length&&!O.length&&!T.length){alert('أدخل عناصر SWOT أولًا أو استخدم بنك الأفكار');return}db.tows.SO=topPairs(S,O).map(p=>makeExpertTows('SO',p.a,p.b));db.tows.WO=topPairs(W,O).map(p=>makeExpertTows('WO',p.a,p.b));db.tows.ST=topPairs(S,T).map(p=>makeExpertTows('ST',p.a,p.b));db.tows.WT=topPairs(W,T).map(p=>makeExpertTows('WT',p.a,p.b));saveAll();renderSWOT();toast('تم إجراء تحليل TOWS وفق الصلة والأولوية')}
function towsCard(k,t){const rows=(db.tows[k]||[]).map((raw,i)=>{const z=typeof raw==='string'?{text:raw,type:k,rationale:'',initiative:'',kpi:'',target:'',owner:'',horizon:'100 يوم',relevance:3,feasibility:3,priority:'متوسطة'}:raw;db.tows[k][i]=z;return `<div class="tows-expert"><h4>${i+1}. <textarea oninput="updTows('${k}',${i},'text',this.value)">${esc(z.text||'')}</textarea></h4><div class="tows-links"><b>عناصر الربط:</b><br>أ: ${esc(z.sourceA||'')}<br>ب: ${esc(z.sourceB||'')}</div><div class="expert-note"><b>منطق التحليل:</b> ${esc(z.rationale||'')}</div><div class="tows-grid"><div><label>المبادرة المقترحة</label><input value="${esc(z.initiative||'')}" oninput="updTows('${k}',${i},'initiative',this.value)"></div><div><label>المؤشر</label><input value="${esc(z.kpi||'')}" oninput="updTows('${k}',${i},'kpi',this.value)"></div><div><label>المستهدف</label><input value="${esc(z.target||'')}" oninput="updTows('${k}',${i},'target',this.value)"></div><div><label>المسؤول</label><input value="${esc(z.owner||'')}" oninput="updTows('${k}',${i},'owner',this.value)"></div><div><label>الأفق الزمني</label><select onchange="updTows('${k}',${i},'horizon',this.value)">${['100 يوم','6-12 شهر','أكثر من سنة'].map(o=>`<option ${z.horizon===o?'selected':''}>${o}</option>`).join('')}</select></div><div><label>الأولوية</label><select onchange="updTows('${k}',${i},'priority',this.value)">${['حرجة','مرتفعة','متوسطة','منخفضة'].map(o=>`<option ${z.priority===o?'selected':''}>${o}</option>`).join('')}</select></div></div><div style="margin-top:8px"><button class="btn primary" onclick="addTowsToPlan('${k}',${i})">تحويل إلى خطة عمل</button></div></div>`}).join('');return `<div class="card"><b>${t}</b>${rows||'<p class="hint">تظهر التوجهات بعد إدخال عناصر كافية وتشغيل التحليل.</p>'}</div>`}

function renderSWOT(){swot.innerHTML=`<div class="section-title"><div><h3>التحليل الاستراتيجي SWOT وTOWS</h3><p class="hint">أدخل واقع الجمعية أو استعِن ببنك الأفكار، ثم راجع العناصر وأدلتها قبل تحليل العلاقات.</p></div><button class="btn primary" onclick="generateTOWS()">إجراء تحليل TOWS الاحترافي</button></div><div class="notice">بنك SWOT استرشادي وليس إجابات جاهزة. لا تعتمد أي عنصر دون التحقق من انطباقه وإضافة دليله والإجراء المناسب.</div><div class="swot">${[['S','نقاط القوة'],['W','نقاط الضعف'],['O','الفرص'],['T','التهديدات']].map(x=>swotBox(x[0],x[1])).join('')}</div><div class="panel"><h3>مصفوفة استخراج التوجهات TOWS</h3><p class="hint">تختار المنصة العلاقات الأعلى صلة، وتوضح منطق الربط والمبادرة والمؤشر والمستهدف والمسؤول، مع بقاء الاعتماد للمستخدم.</p><div class="grid2">${towsCard('SO','استراتيجيات الهجوم — قوة + فرص')+towsCard('WO','استراتيجيات العلاج — ضعف + فرص')+towsCard('ST','استراتيجيات الدفاع — قوة + تهديدات')+towsCard('WT','استراتيجيات الاحتواء — ضعف + تهديدات')}</div></div><div class="panel"><h3>التوجه العام المقترح</h3><div class="analysis">${generalDirection()}</div></div>`}

(function(){
  'use strict';
  const REGISTRY_KEY='diag_assoc_registry_v8';
  let registryMemory=[];
  function clone(x){return JSON.parse(JSON.stringify(x))}
  function newId(){return 'assoc_'+Date.now().toString(36)+'_'+Math.random().toString(36).slice(2,8)}
  function loadRegistry(){
    try{const raw=localStorage.getItem(REGISTRY_KEY);return raw?JSON.parse(raw):registryMemory}
    catch(e){return registryMemory}
  }
  function storeRegistry(list){
    registryMemory=list;
    try{localStorage.setItem(REGISTRY_KEY,JSON.stringify(list));return true}catch(e){return false}
  }
  function hasMeaningfulData(data){
    if(!data)return false;
    const p=data.profile||{};
    return !!(p.name||p.license||p.city||Object.keys(data.pre100||{}).length||Object.keys(data.preQ||{}).length||(data.plan||[]).length);
  }
  function ensureAssociationId(){if(!db.associationId)db.associationId=newId();return db.associationId}
  function registryName(data){return (data.profile&&data.profile.name)||'جمعية بدون اسم'}
  function upsertCurrentToRegistry(){
    if(!hasMeaningfulData(db))return;
    const id=ensureAssociationId();
    const list=loadRegistry();
    const rec={id,name:registryName(db),license:(db.profile||{}).license||'',city:(db.profile||{}).city||'',updated:db.updated||new Date().toISOString(),data:clone(db)};
    const idx=list.findIndex(x=>x.id===id);
    if(idx>=0)list[idx]=rec;else list.unshift(rec);
    storeRegistry(list);
  }
  // migrate the current association from previous single-association versions into the registry once
  if(hasMeaningfulData(db)){ensureAssociationId();upsertCurrentToRegistry();safeStore(db)}
let cloudSaveTimer = null;
let cloudSaving = false;

async function saveCurrentToCloud(showMessage = false) {
  if (!currentUser || !hasMeaningfulData(db)) return false;

  if (cloudSaving) return false;
  cloudSaving = true;

  try {
    // إنشاء الجمعية في Supabase لأول مرة فقط
    if (!db.cloudOrganizationId) {
      const { data: orgId, error: createError } =
        await supabaseClient.rpc('create_organization', {
          p_name: (db.profile && db.profile.name) || 'جمعية بدون اسم',
          p_license_number: (db.profile && db.profile.license) || null,
          p_city: (db.profile && db.profile.city) || null
        });

      if (createError) throw createError;

      db.cloudOrganizationId = orgId;
      safeStore(db);
      upsertCurrentToRegistry();
    }

    // تحديث البيانات الأساسية للجمعية
    const { error: orgError } = await supabaseClient
      .from('organizations')
      .update({
        name: (db.profile && db.profile.name) || 'جمعية بدون اسم',
        license_number: (db.profile && db.profile.license) || null,
        city: (db.profile && db.profile.city) || null
      })
      .eq('id', db.cloudOrganizationId);

    if (orgError) throw orgError;

    // حفظ جميع بيانات المنصة
    const { error: dataError } = await supabaseClient
      .from('organization_data')
      .upsert({
        organization_id: db.cloudOrganizationId,
        schema_version: '8.0',
        data: db,
        last_saved_by: currentUser.id
      }, {
        onConflict: 'organization_id'
      });

    if (dataError) throw dataError;

    if (showMessage) {
      toast('تم الحفظ على الإنترنت بنجاح');
    }

    return true;

  } catch (error) {
    console.error('Cloud save error:', error);

    if (showMessage) {
      toast('تعذر الحفظ السحابي، وتم الاحتفاظ بالنسخة المحلية');
    }

    return false;

  } finally {
    cloudSaving = false;
  }
}

function scheduleCloudSave() {
  clearTimeout(cloudSaveTimer);

  saveCurrentToCloud(false);
}, 400);
}
  const originalSaveAll=window.saveAll;

  if (!msg) {

      .eq('organization_id', id)
      .single();

    if (error) throw error;

    db = normalizeDb(row.data || null);

    db.cloudOrganizationId = id;

    if (!db.associationId) {
      db.associationId = id;
    }

    safeStore(db);

    upsertCurrentToRegistry();

    toast('تم فتح ' + registryName(db));

    showPage('home', navButton('home'));

  } catch (error) {
    console.error('Open association error:', error);

    alert('تعذر تحميل بيانات الجمعية من السحابة.');
  }
};


window.createNewAssociation = function () {

  db = normalizeDb(null);

  db.associationId = newId();

  db.cloudOrganizationId = null;

  db.updated = new Date().toISOString();

  safeStore(db);

  toast('تم إنشاء جمعية جديدة');

  showPage('profile', navButton('profile'));
};


window.resetData = window.createNewAssociation;


window.deleteAssociation = async function (id) {

  if (!confirm(
    'سيتم حذف الجمعية من الحفظ السحابي. هل أنت متأكد؟'
  )) return;

  try {

    const { error } = await supabaseClient
      .from('organizations')
      .delete()
      .eq('id', id);

    if (error) throw error;

    if (db.cloudOrganizationId === id) {
      db = normalizeDb(null);
      db.associationId = newId();
      db.cloudOrganizationId = null;
      safeStore(db);
    }

    toast('تم حذف الجمعية');

    await renderAssociations();

  } catch (error) {
    console.error('Delete association error:', error);

    alert('تعذر حذف الجمعية. تحقق من الصلاحيات.');
  }
};
let realtimeChannel = null;

function startRealtimeSync() {
  if (realtimeChannel) return;

  realtimeChannel = supabaseClient
    .channel('organization-live-sync')
    .on(
      'postgres_changes',
      {
        event: '*',
        schema: 'public',
        table: 'organization_data'
      },
      async (payload) => {

        const changedOrgId =
          payload.new?.organization_id ||
          payload.old?.organization_id;

        // لا نحدث الجمعية المفتوحة إذا كان التغيير لجمعية أخرى
        if (
db.cloudOrganizationId &&
changedOrgId &&
changedOrgId !== db.cloudOrganizationId
        ) {
          return;
        }

        console.log('Realtime update received:', payload);

        // جلب أحدث نسخة من السحابة
if (changedOrgId) {
  const { data: row, error } = await supabaseClient
    .from('organization_data')
    .select('data')
    .eq('organization_id', changedOrgId)
    .single();

  if (!error && row && row.data) {
    db = normalizeDb(row.data);
    db.cloudOrganizationId = changedOrgId;

    if (!db.associationId) {
      db.associationId = changedOrgId;
    }

    safeStore(db);
  }
}
